<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
      .bg { fill: #0f172a; }
      .title { fill: #f8fafc; font-weight: 700; font-size: 22px; }
      .subtitle { fill: #94a3b8; font-weight: 400; font-size: 13px; }
      
      /* Card Styles */
      .card-bg { fill: #1e293b; stroke: #334155; stroke-width: 1.5; rx: 10px; }
      .card-header { fill: #f1f5f9; font-weight: 600; font-size: 14px; }
      .subcard-bg { fill: #0f172a; stroke: #334155; stroke-width: 1; rx: 6px; }
      .subcard-title { fill: #cbd5e1; font-weight: 600; font-size: 12px; }
      .text-dim { fill: #94a3b8; font-size: 11px; }
      .text-code { font-family: 'Fira Code', 'Courier New', monospace; font-size: 11px; fill: #38bdf8; }
      .text-muted { fill: #64748b; font-size: 10px; }
      
      /* Accent Badges */
      .badge-auth { fill: #1e3a8a; stroke: #3b82f6; stroke-width: 1; rx: 4px; }
      .badge-auth-text { fill: #93c5fd; font-size: 10px; font-weight: 600; }
      .badge-data { fill: #064e3b; stroke: #10b981; stroke-width: 1; rx: 4px; }
      .badge-data-text { fill: #6ee7b7; font-size: 10px; font-weight: 600; }
      .badge-mail { fill: #451a03; stroke: #f59e0b; stroke-width: 1; rx: 4px; }
      .badge-mail-text { fill: #fde68a; font-size: 10px; font-weight: 600; }
      
      /* Connectors */
      .line-auth { stroke: #3b82f6; stroke-width: 2; fill: none; stroke-dasharray: 6 3; }
      .line-data { stroke: #10b981; stroke-width: 2; fill: none; }
      .line-mail { stroke: #f59e0b; stroke-width: 2; fill: none; stroke-dasharray: 4 4; }
      .line-db { stroke: #8b5cf6; stroke-width: 1.5; fill: none; }
      
      /* Section Banners */
      .banner-user { fill: #1e293b; stroke: #475569; stroke-width: 1; }
      .banner-fe { fill: #1e1b4b; stroke: #6366f1; stroke-width: 1; }
      .banner-be { fill: #062c44; stroke: #0284c7; stroke-width: 1; }
      .banner-db { fill: #2e1065; stroke: #7c3aed; stroke-width: 1; }
      .banner-mail { fill: #451a03; stroke: #d97706; stroke-width: 1; }
    </style>

    <!-- Arrow Markers -->
    <marker id="arrow-auth" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b82f6" />
    </marker>
    <marker id="arrow-data" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10b981" />
    </marker>
    <marker id="arrow-mail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f59e0b" />
    </marker>
    <marker id="arrow-db" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b5cf6" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="740" class="bg" rx="12" />

  <!-- Header -->
  <g transform="translate(40, 40)">
    <text class="title" x="0" y="0">Smart Tracker — System Architecture &amp; Data Flow</text>
    <text class="subtitle" x="0" y="20">Full-stack overview connecting User Interactions, Frontend SPA, Express REST API, Nodemailer, and MongoDB</text>
  </g>

  <!-- Legend -->
  <g transform="translate(760, 28)">
    <rect width="400" height="34" fill="#1e293b" stroke="#334155" rx="6" />
    <line x1="15" y1="17" x2="40" y2="17" class="line-auth" marker-end="url(#arrow-auth)" />
    <text x="48" y="21" class="text-dim">Auth Flow</text>
    
    <line x1="120" y1="17" x2="145" y2="17" class="line-data" marker-end="url(#arrow-data)" />
    <text x="153" y="21" class="text-dim">CRUD Flow</text>
    
    <line x1="230" y1="17" x2="255" y2="17" class="line-mail" marker-end="url(#arrow-mail)" />
    <text x="263" y="21" class="text-dim">Password Reset</text>
  </g>

  <!-- ==================== COLUMN 1: USER ==================== -->
  <g transform="translate(40, 85)">
    <rect width="160" height="625" class="card-bg" />
    <rect width="160" height="36" class="banner-user" rx="10" />
    <text class="card-header" x="80" y="23" text-anchor="middle">👤 User Layer</text>

    <!-- User Actions -->
    <g transform="translate(12, 50)">
      <rect width="136" height="60" class="subcard-bg" />
      <text class="subcard-title" x="10" y="20">Authentication</text>
      <text class="text-dim" x="10" y="36">• Sign Up / Register</text>
      <text class="text-dim" x="10" y="50">• Sign In / Login</text>
    </g>

    <g transform="translate(12, 122)">
      <rect width="136" height="75" class="subcard-bg" />
      <text class="subcard-title" x="10" y="20">Expense Tracking</text>
      <text class="text-dim" x="10" y="36">• View Expenses</text>
      <text class="text-dim" x="10" y="50">• Add New Expense</text>
      <text class="text-dim" x="10" y="64">• Delete Expense</text>
    </g>

    <g transform="translate(12, 209)">
      <rect width="136" height="88" class="subcard-bg" />
      <text class="subcard-title" x="10" y="20">Task Management</text>
      <text class="text-dim" x="10" y="36">• View Task List</text>
      <text class="text-dim" x="10" y="50">• Create Task</text>
      <text class="text-dim" x="10" y="64">• Complete Task (PUT)</text>
      <text class="text-dim" x="10" y="78">• Delete Task</text>
    </g>

    <g transform="translate(12, 309)">
      <rect width="136" height="75" class="subcard-bg" />
      <text class="subcard-title" x="10" y="20">Account Recovery</text>
      <text class="text-dim" x="10" y="36">• Forgot Password</text>
      <text class="text-dim" x="10" y="50">• Request 6-digit Code</text>
      <text class="text-dim" x="10" y="64">• Submit Reset Form</text>
    </g>

    <g transform="translate(12, 396)">
      <rect width="136" height="75" class="subcard-bg" />
      <text class="subcard-title" x="10" y="20">Analytics / View</text>
      <text class="text-dim" x="10" y="36">• Category Chart</text>
      <text class="text-dim" x="10" y="50">• Filter Expenses</text>
      <text class="text-dim" x="10" y="64">• Dark/Light Theme</text>
    </g>
  </g>

  <!-- ==================== COLUMN 2: FRONTEND ==================== -->
  <g transform="translate(225, 85)">
    <rect width="240" height="625" class="card-bg" />
    <rect width="240" height="36" class="banner-fe" rx="10" />
    <text class="card-header" x="120" y="23" text-anchor="middle">🌐 Client / Frontend</text>

    <!-- Pages -->
    <g transform="translate(12, 50)">
      <rect width="216" height="90" class="subcard-bg" />
      <text class="subcard-title" x="10" y="20">HTML Views</text>
      <text class="text-code" x="10" y="38">index.html</text>
      <text class="text-dim" x="90" y="38">(Auth + Dashboard)</text>
      <text class="text-code" x="10" y="56">dashboard.html</text>
      <text class="text-dim" x="110" y="56">(Chart.js View)</text>
      <text class="text-code" x="10" y="74">styles.css / style.css</text>
    </g>

    <!-- JS Logic -->
    <g transform="translate(12, 150)">
      <rect width="216" height="150" class="subcard-bg" />
      <text class="subcard-title" x="10" y="20">JavaScript Modules</text>
      
      <text class="text-code" x="10" y="40">app.js</text>
      <text class="text-dim" x="65" y="40">Core SPA &amp; apiCall() helper</text>
      
      <text class="text-code" x="10" y="60">auth.js</text>
      <text class="text-dim" x="65" y="60">Tab toggle &amp; form handlers</text>
      
      <text class="text-code" x="10" y="80">dashboard.js</text>
      <text class="text-dim" x="105" y="80">Chart.js &amp; filtering</text>

      <rect x="10" y="94" width="196" height="44" fill="#1e293b" rx="4" />
      <text class="subcard-title" x="16" y="110">Browser Storage</text>
      <text class="text-code" x="16" y="126">localStorage: userId, userName</text>
    </g>

    <!-- API Client / Fetch -->
    <g transform="translate(12, 312)">
      <rect width="216" height="110" class="subcard-bg" />
      <text class="subcard-title" x="10" y="20">HTTP Client Layer</text>
      <text class="text-dim" x="10" y="38">• Uses Native <tspan class="text-code">fetch()</tspan></text>
      <text class="text-dim" x="10" y="56">• Content-Type: application/json</text>
      
      <rect x="10" y="66" width="196" height="32" fill="#0f172a" stroke="#3b82f6" stroke-width="1" rx="4" />
      <text class="text-code" x="16" y="80" fill="#60a5fa">Header: user-id = &lt;userId&gt;</text>
      <text class="text-muted" x="16" y="92">(Auth check on protected routes)</text>
    </g>

    <!-- UI Components -->
    <g transform="translate(12, 434)">
      <rect width="216" height="70" class="subcard-bg" />
      <text class="subcard-title" x="10" y="20">UI Interactions</text>
      <text class="text-dim" x="10" y="36">• Toast Notifications (showToast)</text>
      <text class="text-dim" x="10" y="52">• Dynamic DOM Table &amp; List Updates</text>
    </g>
  </g>

  <!-- ==================== COLUMN 3: BACKEND API ==================== -->
  <g transform="translate(490, 85)">
    <rect width="270" height="625" class="card-bg" />
    <rect width="270" height="36" class="banner-be" rx="10" />
    <text class="card-header" x="135" y="23" text-anchor="middle">⚙️ Express Backend (Node.js)</text>

    <!-- Entry & Middleware -->
    <g transform="translate(12, 50)">
      <rect width="246" height="90" class="subcard-bg" />
      <text class="subcard-title" x="10" y="20">Server Core (server.js)</text>
      <text class="text-dim" x="10" y="38">• Express 5 + CORS + Static Serving</text>
      
      <rect x="10" y="46" width="226" height="34" fill="#022c22" stroke="#10b981" stroke-width="1" rx="4" />
      <text class="subcard-title" x="16" y="60" fill="#34d399">Middleware: checkAuth()</text>
      <text class="text-dim" x="16" y="73">Reads req.headers['user-id']</text>
    </g>

    <!-- Auth Router -->
    <g transform="translate(12, 150)">
      <rect width="246" height="155" class="subcard-bg" />
      <rect x="180" y="8" width="56" height="18" class="badge-auth" />
      <text x="208" y="21" text-anchor="middle" class="badge-auth-text">/api/auth</text>
      
      <text class="subcard-title" x="10" y="20">Auth Controller (auth.js)</text>
      
      <text class="text-code" x="10" y="40">POST /register</text>
      <text class="text-dim" x="105" y="40">bcrypt.hash(pass, 10)</text>
      
      <text class="text-code" x="10" y="58">POST /login</text>
      <text class="text-dim" x="90" y="58">bcrypt.compare()</text>
      
      <text class="text-code" x="10" y="76">POST /forgot-password</text>
      <text class="text-dim" x="150" y="76">Gen 6-digit code</text>
      
      <text class="text-code" x="10" y="94">POST /reset-password</text>
      <text class="text-dim" x="145" y="94">Validate code &amp; exp</text>

      <rect x="10" y="106" width="226" height="38" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" rx="4" />
      <text class="subcard-title" x="16" y="120" fill="#a5b4fc">Utils: mailer.js</text>
      <text class="text-dim" x="16" y="134">sendResetCode(email, token)</text>
    </g>

    <!-- Expenses Router -->
    <g transform="translate(12, 315)">
      <rect width="246" height="115" class="subcard-bg" />
      <rect x="154" y="8" width="82" height="18" class="badge-data" />
      <text x="195" y="21" text-anchor="middle" class="badge-data-text">/api/expenses</text>
      
      <text class="subcard-title" x="10" y="20">Expenses API (expenses.js)</text>
      
      <text class="text-code" x="10" y="40">GET /</text>
      <text class="text-dim" x="70" y="40">Find by userId, sort date descending</text>
      
      <text class="text-code" x="10" y="60">POST /</text>
      <text class="text-dim" x="70" y="60">Create expense (title, amount, cat)</text>
      
      <text class="text-code" x="10" y="80">DELETE /:id</text>
      <text class="text-dim" x="90" y="80">Verify userId &amp; delete</text>

      <text class="text-muted" x="10" y="100">Categories: Food, Transport, Utilities, etc.</text>
    </g>

    <!-- Tasks Router -->
    <g transform="translate(12, 440)">
      <rect width="246" height="120" class="subcard-bg" />
      <rect x="170" y="8" width="66" height="18" class="badge-data" />
      <text x="203" y="21" text-anchor="middle" class="badge-data-text">/api/tasks</text>
      
      <text class="subcard-title" x="10" y="20">Tasks API (tasks.js)</text>
      
      <text class="text-code" x="10" y="40">GET /</text>
      <text class="text-dim" x="70" y="40">Find by userId, sort createdAt</text>
      
      <text class="text-code" x="10" y="60">POST /</text>
      <text class="text-dim" x="70" y="60">Create task (taskName, status)</text>
      
      <text class="text-code" x="10" y="80">PUT /:id</text>
      <text class="text-dim" x="75" y="80">Toggle status (pending/completed)</text>

      <text class="text-code" x="10" y="100">DELETE /:id</text>
      <text class="text-dim" x="95" y="100">Delete task by id</text>
    </g>
  </g>

  <!-- ==================== COLUMN 4: DATABASE & SERVICES ==================== -->
  
  <!-- Email Service -->
  <g transform="translate(790, 85)">
    <rect width="370" height="130" class="card-bg" />
    <rect width="370" height="36" class="banner-mail" rx="10" />
    <text class="card-header" x="185" y="23" text-anchor="middle">✉️ External Email Service</text>

    <g transform="translate(12, 48)">
      <rect width="346" height="68" class="subcard-bg" />
      <rect x="250" y="8" width="86" height="18" class="badge-mail" />
      <text x="293" y="21" text-anchor="middle" class="badge-mail-text">Nodemailer</text>
      
      <text class="subcard-title" x="10" y="20">Gmail SMTP Transporter</text>
      <text class="text-dim" x="10" y="38">• Sends 6-Digit Password Reset Verification HTML Email</text>
      <text class="text-code" x="10" y="54">Env: EMAIL_USER &amp; EMAIL_PASS (App Password)</text>
    </g>
  </g>

  <!-- Database & Models -->
  <g transform="translate(790, 235)">
    <rect width="370" height="475" class="card-bg" />
    <rect width="370" height="36" class="banner-db" rx="10" />
    <text class="card-header" x="185" y="23" text-anchor="middle">🗄️ Database Layer (MongoDB)</text>

    <!-- User Model -->
    <g transform="translate(12, 50)">
      <rect width="346" height="120" class="subcard-bg" stroke="#8b5cf6" stroke-width="1.5" />
      <text class="subcard-title" x="10" y="20" fill="#a78bfa">User Model (User.js)</text>
      
      <text class="text-code" x="10" y="38">_id: ObjectId</text>
      <text class="text-dim" x="120" y="38">(Primary Key)</text>
      
      <text class="text-code" x="10" y="54">name: String</text>
      <text class="text-code" x="10" y="70">email: String</text>
      <text class="text-dim" x="120" y="70">(Unique)</text>
      
      <text class="text-code" x="10" y="86">password: String</text>
      <text class="text-dim" x="135" y="86">(bcrypt hashed)</text>

      <text class="text-code" x="10" y="102">resetToken: String | resetTokenExpiry: Date</text>
    </g>

    <!-- Expense Model -->
    <g transform="translate(12, 182)">
      <rect width="346" height="125" class="subcard-bg" />
      <text class="subcard-title" x="10" y="20" fill="#34d399">Expense Model (Expense.js)</text>
      
      <text class="text-code" x="10" y="38">_id: ObjectId</text>
      <text class="text-code" x="10" y="54">userId: ObjectId</text>
      <text class="text-dim" x="130" y="54">➜ Ref: User (Foreign Key)</text>
      
      <text class="text-code" x="10" y="70">title: String</text>
      <text class="text-code" x="10" y="86">amount: Number</text>

      <text class="text-code" x="10" y="102">category: Enum</text>
      <text class="text-dim" x="125" y="102">['Food', 'Transport', 'Utilities', ...]</text>
      
      <text class="text-code" x="10" y="118">date: Date</text>
    </g>

    <!-- Task Model -->
    <g transform="translate(12, 318)">
      <rect width="346" height="110" class="subcard-bg" />
      <text class="subcard-title" x="10" y="20" fill="#34d399">Task Model (Task.js)</text>
      
      <text class="text-code" x="10" y="38">_id: ObjectId</text>
      <text class="text-code" x="10" y="54">userId: ObjectId</text>
      <text class="text-dim" x="130" y="54">➜ Ref: User (Foreign Key)</text>
      
      <text class="text-code" x="10" y="70">taskName: String</text>
      <text class="text-code" x="10" y="86">status: Enum</text>
      <text class="text-dim" x="110" y="86">['pending', 'completed']</text>
      
      <text class="text-code" x="10" y="102">createdAt: Date</text>
    </g>

    <text class="text-muted" x="12" y="455">Connection: mongoose.connect(process.env.MONGO_URI)</text>
  </g>

  <!-- ==================== CONNECTORS ==================== -->
  
  <!-- Auth flow line (User to FE) -->
  <path d="M 200 160 L 225 160" class="line-auth" marker-end="url(#arrow-auth)" />
  
  <!-- Auth flow line (FE to BE) -->
  <path d="M 465 210 L 490 210" class="line-auth" marker-end="url(#arrow-auth)" />

  <!-- Data CRUD line (User to FE) -->
  <path d="M 200 240 L 225 240" class="line-data" marker-end="url(#arrow-data)" />

  <!-- Data CRUD line (FE to BE) -->
  <path d="M 465 375 L 490 375" class="line-data" marker-end="url(#arrow-data)" />

  <!-- Password reset line (User to FE) -->
  <path d="M 200 420 L 225 420" class="line-mail" marker-end="url(#arrow-mail)" />

  <!-- BE to Mailer / Nodemailer -->
  <path d="M 736 270 L 760 270 L 760 145 L 790 145" class="line-mail" marker-end="url(#arrow-mail)" />

  <!-- Mailer to User email -->
  <path d="M 790 170 L 120 170 L 120 395" class="line-mail" stroke-dasharray="2 4" opacity="0.6" marker-end="url(#arrow-mail)" />

  <!-- BE to DB (Auth -> User Model) -->
  <path d="M 736 230 L 790 330" class="line-db" marker-end="url(#arrow-db)" />

  <!-- BE to DB (Expenses -> Expense Model) -->
  <path d="M 736 375 L 790 375" class="line-db" marker-end="url(#arrow-db)" />

  <!-- BE to DB (Tasks -> Task Model) -->
  <path d="M 736 500 L 790 500" class="line-db" marker-end="url(#arrow-db)" />

  <!-- Foreign Key Relations inside DB -->
  <path d="M 850 205 L 850 232" class="line-db" stroke-dasharray="2 2" />
  <path d="M 850 307 L 850 368" class="line-db" stroke-dasharray="2 2" />

</svg>
